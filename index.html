<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0605">
<title>Tradition Tattoo — Данков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--neon:#ff4a1c;--amber:#ff9a2e;--ink:#fff1e6;--soft:rgba(255,235,220,.7);--card:rgba(14,6,5,.62);--card-hi:rgba(34,12,8,.72);--edge:rgba(255,92,40,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0b0605}
body{font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.bg{position:fixed;inset:0;z-index:-1;display:flex;gap:10px;overflow:hidden;background:#0b0605}
.col{flex:1;min-width:0;overflow:hidden}
.track{display:flex;flex-direction:column;gap:10px;will-change:transform;animation:flow 90s linear infinite}
.col:nth-child(2) .track{animation-duration:120s}
.col:nth-child(3){display:none}
.track img{width:100%;height:auto;display:block;border-radius:6px;filter:blur(2.5px) brightness(.62) contrast(1.08) saturate(.9)}
@keyframes flow{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@media(min-width:760px){.col:nth-child(3){display:block}}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 28%,rgba(255,74,28,.16),transparent 60%),linear-gradient(180deg,rgba(9,4,3,.72),rgba(9,4,3,.55) 40%,rgba(9,4,3,.82))}
main{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;padding:44px 22px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:150px;height:150px;border-radius:50%;padding:4px;background:linear-gradient(145deg,var(--amber),var(--neon));box-shadow:0 0 22px rgba(255,74,28,.7),0 0 60px rgba(255,74,28,.35);margin-bottom:24px;animation:pulse 3.6s ease-in-out infinite}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid #0b0605}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,120,40,.9),0 0 80px rgba(255,74,28,.5)}}
h1{font-family:'Unbounded',system-ui,sans-serif;font-weight:600;font-size:clamp(1.7rem,8vw,2.3rem);line-height:1.1;text-align:center;text-transform:uppercase;letter-spacing:.02em;color:#fff3ea;text-shadow:0 0 8px rgba(255,120,50,.9),0 0 24px rgba(255,74,28,.7),0 0 48px rgba(255,74,28,.4)}
.sub{margin-top:12px;color:var(--soft);font-size:1rem;text-align:center;letter-spacing:.14em;text-transform:uppercase}
.links{width:100%;margin-top:32px;display:flex;flex-direction:column;gap:12px}
.link,.teamBtn{width:100%;display:flex;align-items:center;gap:16px;padding:13px 18px 13px 13px;border-radius:22px;color:var(--ink);text-decoration:none;font:inherit;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--edge);box-shadow:0 0 14px rgba(255,74,28,.18),inset 0 0 18px rgba(255,74,28,.06);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .2s,transform .2s,box-shadow .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.link:hover,.teamBtn:hover{background:var(--card-hi);border-color:var(--amber);box-shadow:0 0 22px rgba(255,100,30,.45),inset 0 0 20px rgba(255,74,28,.1)}
.link:active,.teamBtn:active{transform:scale(.98)}
.link:focus-visible,.teamBtn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.ico{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:1rem;background:linear-gradient(145deg,#ff7a1f,#e0300f);box-shadow:0 0 14px rgba(255,74,28,.55)}
.ico svg{width:26px;height:26px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.txt b{font-weight:600;font-size:1.06rem}
.txt span{font-size:.88rem;color:var(--soft)}
.chev{flex:none;width:20px;height:20px;color:var(--amber);opacity:.9;transition:transform .3s}
.team.open .chev{transform:rotate(90deg)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.team.open .panel{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.sublinks{display:flex;flex-direction:column;gap:10px;padding:12px 0 2px 14px;border-left:2px solid var(--edge);margin:10px 0 0 26px}
.sublinks a{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:18px;color:var(--ink);text-decoration:none;font-weight:500;background:var(--card);border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color .2s,box-shadow .2s}
.sublinks a:hover{border-color:var(--amber);box-shadow:0 0 18px rgba(255,100,30,.4)}
.sublinks a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sublinks .em{font-size:1.3rem}
.addr{margin-top:28px;text-align:center;color:var(--soft);font-size:.98rem;line-height:1.5}
.addr b{display:block;color:var(--ink);font-weight:600;font-size:1.05rem;text-shadow:0 0 12px rgba(255,74,28,.6)}
@media(prefers-reduced-motion:reduce){.track,.logo{animation:none}}
</style>
</head>
